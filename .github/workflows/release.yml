name: Test and release

# Every push runs the full test suite. On main, a plugin version with no release yet
# is built, signed and published, but only after the tests pass.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        wp: ["6.9", "latest"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: sqlite3, pdo_sqlite, sodium, zip, mbstring, dom, libxml
          coverage: none

      - name: Lint PHP
        run: for f in $(git ls-files '*.php'); do php -l "$f" > /dev/null || exit 1; done

      - name: Python requirements
        run: pip install requests

      - name: Run suites
        env:
          VR_SIGNING_KEY: ${{ secrets.VR_SIGNING_KEY }}
          WP_VERSION: ${{ matrix.wp }}
          SQLITE_PLUGIN_VERSION: latest
        run: |
          keyfile="$RUNNER_TEMP/signing.key"
          if [ -n "$VR_SIGNING_KEY" ]; then
            printf '%s' "$VR_SIGNING_KEY" > "$keyfile"
          else
            # Forks and pull requests have no secret: sign test releases with a throwaway key.
            php -r 'echo base64_encode(sodium_crypto_sign_secretkey(sodium_crypto_sign_keypair()));' > "$keyfile"
            echo "::warning::VR_SIGNING_KEY not available; signed-update tests use a throwaway key and will fail."
          fi
          VR_SIGNING_KEY_FILE="$keyfile" VR_TEST_ROOT="$RUNNER_TEMP/site" tests/run.sh
          rm -f "$keyfile"

      - name: Server log on failure
        if: failure()
        run: tail -100 "$RUNNER_TEMP/site/server.log" "$RUNNER_TEMP/site/wp/wp-content/debug.log" || true

  release:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read plugin version
        id: ver
        run: |
          version="$(grep -oE "VR_PLUGIN_VERSION', '[0-9.]+" visual-realm.php | grep -oE '[0-9.]+$')"
          header="$(grep -oE '^ \* Version: +[0-9.]+' visual-realm.php | grep -oE '[0-9.]+$')"
          echo "constant=$version header=$header"
          test -n "$version" && test "$version" = "$header"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Skip if this version is already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.ver.outputs.version }}" >/dev/null 2>&1; then
            echo "v${{ steps.ver.outputs.version }} already released"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and sign
        if: steps.check.outputs.skip == 'false'
        env:
          VR_SIGNING_KEY: ${{ secrets.VR_SIGNING_KEY }}
        run: |
          test -n "$VR_SIGNING_KEY" || { echo "Add the VR_SIGNING_KEY repository secret"; exit 1; }
          php -r 'exit(function_exists("sodium_crypto_sign_detached") ? 0 : 1);'
          keyfile="$RUNNER_TEMP/signing.key"
          printf '%s' "$VR_SIGNING_KEY" > "$keyfile"
          VR_SIGNING_KEY_FILE="$keyfile" bin/build-release.sh dist
          rm -f "$keyfile"

      - name: Check signature matches the key built into the plugin
        if: steps.check.outputs.skip == 'false'
        run: |
          php -r '
          preg_match("/PUBLIC_KEY = \x27([^\x27]+)\x27/", file_get_contents("includes/class-vr-updater.php"), $m);
          $ok = sodium_crypto_sign_verify_detached(base64_decode(file_get_contents("dist/visual-realm.zip.sig")), file_get_contents("dist/visual-realm.zip"), base64_decode($m[1]));
          if (!$ok) { fwrite(STDERR, "Signature does not match the plugin public key\n"); exit(1); }
          echo "signature ok\n";'

      - name: Check the zip carries no test or build files
        if: steps.check.outputs.skip == 'false'
        run: |
          ! unzip -l dist/visual-realm.zip | grep -E "visual-realm/(tests|bin|\.github|dist)/"

      - name: Publish release
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.ver.outputs.version }}"
          gh release create "v$v" dist/visual-realm.zip dist/visual-realm.zip.sig \
            --target "$GITHUB_SHA" --title "$v" --generate-notes
